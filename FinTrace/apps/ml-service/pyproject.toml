name = "fintrace-ml-service"
version = "1.0.0"
description = "FinTrace ML Fraud Detection Microservice"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.5.0"
scikit-learn = "^1.3.2"
pandas = "^2.1.3"
numpy = "^1.26.2"
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
joblib = "^1.3.2"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
black = "^23.12.0"
pylint = "^3.0.3"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
